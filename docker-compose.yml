services:
  mysql:
    image: mysql:8.0
    container_name: kampus-bite-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kampus_bite
      MYSQL_USER: kampus
      MYSQL_PASSWORD: kampus
    volumes:
      - kampus-bite-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kampus-bite-mysql-data:
